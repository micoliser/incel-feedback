name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish to GHCR
        required: false
        default: latest

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.sha }}
  LATEST_TAG: ${{ inputs.image_tag || 'latest' }}
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:
  build-check:
    name: Build check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: incel_feedback_db
          POSTGRES_USER: incel_feedback_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incel_feedback_user -d incel_feedback_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://incel_feedback_user:ci_test_password@127.0.0.1:5432/incel_feedback_db
      ADMIN_PASSWORD: ci-admin
      ADMIN_SESSION_SECRET: ci-session-secret
      EMAIL_ENABLED: "false"
      EMAIL_DEBUG: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Build Next.js app
        run: npm run build

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - build-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/incel-feedback:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.GHCR_OWNER }}/incel-feedback:${{ env.LATEST_TAG }}

  deploy-to-caprover:
    name: Deploy to CapRover
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: incel-feedback
          token: ${{ secrets.CAPROVER_TOKEN_FEEDBACK }}
          image: ghcr.io/${{ env.GHCR_OWNER }}/incel-feedback:${{ env.LATEST_TAG }}
